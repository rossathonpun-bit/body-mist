<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ | Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="index.html">Body Scent</a>
      <ul class="nav-links">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="page-head container">
      <h1>สั่งซื้อสินค้า</h1>
      <hr class="divider">
      <p>กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
    </div>

    <div class="form-wrap">
      <form id="orderForm">
        <div class="form-group">
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="contact">เบอร์โทร / Line</label>
          <input type="text" id="contact" name="contact" autocomplete="tel" required>
        </div>

        <div class="form-group">
          <label for="items">รายการสินค้า</label>
          <input type="text" id="items" name="items" required>
        </div>

        <div class="form-group">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="text" id="total" name="total" inputmode="numeric" required>
        </div>

        <div class="form-group">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note"></textarea>
        </div>

        <button type="submit" class="btn btn--solid btn--block">ยืนยันสั่งซื้อ</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="logo">Body Scent</span>
      <p class="mb-0">กลิ่นหอมที่สะท้อนทุกอารมณ์และความเป็นตัวคุณ</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
